<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#0a0c10"/>
<title>LiveTiming Upscale</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
:root{--bg:#0a0c10;--panel:#12151c;--border:#2a3140;--text:#e8ecf4;--muted:#9aa3b5;--accent:#5b8cff;--bad:#f87171;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:max(6px,var(--safe-t)) 8px 6px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;z-index:2}
#bar strong{font-size:12px;white-space:nowrap}
#bar .sub{color:var(--muted);font-size:10px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28vw}
button,select{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--border);background:#1a1f2a;color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:34px}
button.primary{background:var(--accent);border-color:transparent;color:#fff}
button:disabled{opacity:.4}
#urlBox{display:none;flex-wrap:wrap;gap:6px;padding:6px 8px;background:#0d1118;border-bottom:1px solid var(--border);flex-shrink:0}
#urlBox.open{display:flex}
#urlInput{flex:1;min-width:140px;font:inherit;font-size:13px;border:1px solid var(--border);background:#1a1f2a;color:var(--text);border-radius:8px;padding:8px 10px}
#stage{position:relative;flex:1 1 auto;min-height:0;width:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center center;background:#000;z-index:1}
#canvas{position:relative;z-index:2;display:none;background:#000}
#stage.mode-canvas #canvas{display:block}
#stage.mode-canvas #video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-99px;top:-99px}
#empty{position:absolute;inset:0;z-index:3;display:grid;place-content:center;text-align:center;color:var(--muted);padding:16px;gap:6px;pointer-events:none}
#empty strong{color:var(--text);font-size:16px}
#empty p{margin:0;max-width:400px;line-height:1.4;font-size:13px}
#stage.has-video #empty{display:none}
#controls{flex-shrink:0;background:var(--panel);border-top:1px solid var(--border);padding:6px 10px calc(8px + var(--safe-b));display:flex;flex-direction:column;gap:4px;z-index:2}
.row{display:flex;align-items:center;gap:8px}
#seek{flex:1;min-width:0;height:8px;accent-color:var(--accent)}
#vol{width:88px;height:8px;accent-color:var(--accent)}
#sharp{width:72px;height:8px;accent-color:var(--accent)}
#timeLabel{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:92px;text-align:right;white-space:nowrap}
#status{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status.error{color:var(--bad)}
.lab{font-size:11px;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<div id="bar">
<strong>LiveTiming Upscale</strong>
<span class="sub">full frame · sound · upscale</span>
<button type="button" class="primary" id="btnFile">Open video</button>
<button type="button" id="btnUrl">YouTube / URL</button>
<select id="preset" title="Upscale">
<option value="css" selected>Sharpen (full frame + sound)</option>
<option value="max">Pixel Max 2×</option>
<option value="balanced">Pixel 1.5×</option>
<option value="off">Off</option>
</select>
</div>
<div id="urlBox">
<input id="urlInput" type="url" placeholder="YouTube link or https://…mp4"/>
<button type="button" class="primary" id="btnGo">Load</button>
<button type="button" id="btnCancelUrl">Cancel</button>
</div>
<div id="stage" class="mode-video">
<video id="video" playsinline webkit-playsinline></video>
<canvas id="canvas"></canvas>
<div id="empty">
<strong>Full-frame player</strong>
<p>Video is letterboxed so you always see the whole picture. Use seek + volume below. Default mode keeps full frame + sound.</p>
</div>
</div>
<div id="controls">
<div class="row">
<button type="button" id="btnPlay" disabled>Play</button>
<input type="range" id="seek" min="0" max="1000" value="0" disabled/>
<span id="timeLabel">0:00 / 0:00</span>
</div>
<div class="row">
<button type="button" id="btnMute" disabled>🔊</button>
<span class="lab">Vol</span>
<input type="range" id="vol" min="0" max="100" value="100" disabled/>
<span class="lab">Sharp</span>
<input type="range" id="sharp" min="0" max="100" value="60"/>
<button type="button" id="btnFs" disabled>Fullscreen</button>
</div>
<div id="status">Ready</div>
</div>
<input type="file" id="file" accept="video/*,.mkv,.ts,.m3u8,.mov" hidden/>
<script>
(function(){
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const stage=document.getElementById('stage');
const presetEl=document.getElementById('preset');
const sharpEl=document.getElementById('sharp');
const btnPlay=document.getElementById('btnPlay');
const btnFs=document.getElementById('btnFs');
const btnMute=document.getElementById('btnMute');
const seek=document.getElementById('seek');
const vol=document.getElementById('vol');
const timeLabel=document.getElementById('timeLabel');
const statusEl=document.getElementById('status');
const fileInput=document.getElementById('file');
const urlBox=document.getElementById('urlBox');
const urlInput=document.getElementById('urlInput');
let objectUrl=null,hls=null,raf=0,running=false,seeking=false;
function status(msg,isError){statusEl.textContent=msg;statusEl.classList.toggle('error',!!isError)}
function fmt(t){if(!isFinite(t)||t<0)return'0:00';const s=Math.floor(t%60),m=Math.floor(t/60)%60,h=Math.floor(t/3600);const pad=n=>String(n).padStart(2,'0');return h>0?h+':'+pad(m)+':'+pad(s):m+':'+pad(s)}
function armUi(){stage.classList.add('has-video');btnPlay.disabled=false;btnFs.disabled=false;btnMute.disabled=false;seek.disabled=false;vol.disabled=false}
function destroyHls(){if(hls){try{hls.destroy()}catch(e){}hls=null}}
function applyVolume(){const v=Number(vol.value)/100;video.volume=Math.max(0,Math.min(1,v));video.muted=v<=0.001;btnMute.textContent=video.muted?'🔇':'🔊'}
function applyCssSharpen(){const amt=Number(sharpEl.value)/100;const mode=presetEl.value;if(mode==='off'){video.style.filter='none';return}if(mode==='css'){video.style.filter='contrast('+(1+amt*0.35)+') saturate('+(1+amt*0.08)+')'}else{video.style.filter='none'}}
function setMode(){const mode=presetEl.value;if(mode==='max'||mode==='balanced'){stage.classList.add('mode-canvas');stage.classList.remove('mode-video');startLoop()}else{stage.classList.remove('mode-canvas');stage.classList.add('mode-video');stopLoop();applyCssSharpen()}}
function tryPlay(){applyVolume();video.muted=false;if(Number(vol.value)<5)vol.value='100';applyVolume();setMode();const p=video.play();if(p&&p.then)p.then(()=>{btnPlay.textContent='Pause';status('Playing · full frame')}).catch(()=>{btnPlay.textContent='Play';status('Tap Play for sound')})}
function parseYouTubeId(url){try{const u=new URL(url);const h=u.hostname.replace(/^www\./,'');if(h==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||null;if(/youtube/.test(h)){if(u.searchParams.get('v'))return u.searchParams.get('v');const parts=u.pathname.split('/').filter(Boolean);const m=['embed','live','shorts','v'];for(let i=0;i<parts.length-1;i++)if(m.includes(parts[i]))return parts[i+1]}}catch(e){}const x=String(url).match(/(?:v=|\/)([a-zA-Z0-9_-]{11})(?:[?&]|$)/);return x?x[1]:null}
window.__onYoutubeResolved=function(err,directUrl,title,proxyUrl){if(err){status('yt-dlp: '+err,true);return}var src=directUrl||proxyUrl;if(!src){status('No stream URL',true);return}destroyHls();if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}video.removeAttribute('crossorigin');video.src=src;armUi();status('yt-dlp · '+(title||'playing'));try{video.load()}catch(e){}tryPlay()};
window.__androidLoadYoutube=function(url){urlInput.value=url;loadUrl(url)};
function loadYouTube(pageUrl){destroyHls();if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}if(window.AndroidBridge&&AndroidBridge.resolveYoutube){status('yt-dlp resolving…');try{AndroidBridge.resolveYoutube(pageUrl)}catch(e){status('Bridge error: '+e,true)}return}status('Need Android app for YouTube',true)}
function loadUrl(url){url=(url||'').trim();if(!url){status('No URL',true);return}if(!/^https?:\/\//i.test(url)&&!url.startsWith('blob:')){status('Need http(s) URL',true);return}if(parseYouTubeId(url)){loadYouTube(url);return}destroyHls();if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}video.removeAttribute('crossorigin');armUi();status('Loading…');if(/\.m3u8|m3u8/i.test(url)&&window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>tryPlay());hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)status('HLS error',true)});return}video.src=url;video.addEventListener('loadeddata',function once(){video.removeEventListener('loadeddata',once);tryPlay()});video.addEventListener('error',()=>status('Playback error',true));try{video.load()}catch(e){}}
function loadFile(file){if(!file)return;destroyHls();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(file);video.removeAttribute('crossorigin');video.src=objectUrl;armUi();status('Loaded: '+file.name);tryPlay()}
function layoutCanvas(bufW,bufH){const rect=stage.getBoundingClientRect();const sw=rect.width,sh=rect.height;if(sw<2||sh<2)return;const scale=Math.min(sw/bufW,sh/bufH);canvas.style.width=Math.max(1,Math.floor(bufW*scale))+'px';canvas.style.height=Math.max(1,Math.floor(bufH*scale))+'px'}
function stopLoop(){running=false;cancelAnimationFrame(raf)}
function startLoop(){if(running)return;running=true;const tick=()=>{if(!running)return;renderFrame();raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
function renderFrame(){if(!video.videoWidth)return;if(presetEl.value!=='max'&&presetEl.value!=='balanced')return;const scaleMul=presetEl.value==='max'?2:1.5;const sharpAmt=Number(sharpEl.value)/100;let outW=Math.round(video.videoWidth*scaleMul),outH=Math.round(video.videoHeight*scaleMul);const maxEdge=1920;if(outW>maxEdge||outH>maxEdge){const r=Math.min(maxEdge/outW,maxEdge/outH);outW=Math.round(outW*r);outH=Math.round(outH*r)}if(canvas.width!==outW||canvas.height!==outH){canvas.width=outW;canvas.height=outH}layoutCanvas(outW,outH);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(video,0,0,outW,outH);if(sharpAmt<=0.01||outW*outH>1280*720)return;try{const img=ctx.getImageData(0,0,outW,outH);const d=img.data,copy=new Uint8ClampedArray(d),w=outW,h=outH,amount=0.3+sharpAmt*0.9,contrast=1+sharpAmt*0.25,mid=128;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=(y*w+x)*4;for(let c=0;c<3;c++){const center=copy[i+c];const blur=(copy[i-4+c]+copy[i+4+c]+copy[((y-1)*w+x)*4+c]+copy[((y+1)*w+x)*4+c])*0.25;let v=center+(center-blur)*amount;v=(v-mid)*contrast+mid;d[i+c]=v<0?0:v>255?255:v}}ctx.putImageData(img,0,0)}catch(e){}}
document.getElementById('btnFile').onclick=()=>fileInput.click();
fileInput.onchange=()=>{const f=fileInput.files&&fileInput.files[0];if(f)loadFile(f)};
document.getElementById('btnUrl').onclick=()=>{urlBox.classList.add('open');urlInput.focus()};
document.getElementById('btnCancelUrl').onclick=()=>urlBox.classList.remove('open');
document.getElementById('btnGo').onclick=()=>{urlBox.classList.remove('open');loadUrl(urlInput.value)};
urlInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('btnGo').click()}});
btnPlay.onclick=()=>{if(video.paused){applyVolume();video.muted=false;video.play().then(()=>{btnPlay.textContent='Pause';status('Playing');setMode()}).catch(()=>status('Tap Play again',true))}else{video.pause();btnPlay.textContent='Play'}};
btnMute.onclick=()=>{if(video.muted||video.volume===0){video.muted=false;if(Number(vol.value)<5)vol.value='80'}else{video.muted=true}applyVolume()};
vol.addEventListener('input',applyVolume);
sharpEl.addEventListener('input',applyCssSharpen);
presetEl.addEventListener('change',()=>{setMode();applyCssSharpen()});
seek.addEventListener('input',()=>{seeking=true;if(video.duration)video.currentTime=(Number(seek.value)/1000)*video.duration});
seek.addEventListener('change',()=>{seeking=false});
btnFs.onclick=()=>{if(!document.fullscreenElement){(stage.requestFullscreen||stage.webkitRequestFullscreen)?.call(stage)}else{document.exitFullscreen?.()}};
video.addEventListener('timeupdate',()=>{if(!seeking&&video.duration)seek.value=String(Math.floor((video.currentTime/video.duration)*1000));timeLabel.textContent=fmt(video.currentTime)+' / '+fmt(video.duration)});
video.addEventListener('play',()=>{btnPlay.textContent='Pause';setMode()});
video.addEventListener('pause',()=>{btnPlay.textContent='Play';stopLoop()});
video.addEventListener('loadedmetadata',()=>{timeLabel.textContent='0:00 / '+fmt(video.duration)});
video.addEventListener('error',()=>{status('Video error — try another link or Open video',true)});
window.addEventListener('resize',()=>{if(canvas.width)layoutCanvas(canvas.width,canvas.height)});
video.volume=1;video.muted=false;applyVolume();applyCssSharpen();
status(window.AndroidBridge?'Ready — YouTube or Open video':'Ready');
})();
</script>
</body>
</html>
